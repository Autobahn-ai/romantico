<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailDraft</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #2563eb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .content { padding: 16px; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: #374151; margin-top: 8px; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: #dc2626; margin-top: 8px; }
    .btn-danger:hover { background: #fecaca; }
    .user-info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .user-info p { font-size: 12px; color: #0369a1; }
    .user-info strong { display: block; font-size: 13px; color: #0c4a6e; margin-bottom: 2px; }
    #login-section, #user-section { display: none; }
    .status { font-size: 12px; color: #6b7280; text-align: center; margin-top: 8px; }
    .app-url-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
    .app-url-section label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 4px; }
    .app-url-section input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    .save-url-btn {
      margin-top: 6px;
      padding: 6px 12px;
      background: #f1f5f9;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <h1>MailDraft</h1>
  </div>

  <div class="content">
    <!-- Not logged in -->
    <div id="login-section">
      <p style="color: #6b7280; font-size: 13px; margin-bottom: 16px;">
        Sign in to access your team's email templates directly in Gmail.
      </p>
      <button class="btn btn-primary" id="login-btn">Sign in with Google</button>
      <p class="status" id="login-status"></p>
    </div>

    <!-- Logged in -->
    <div id="user-section">
      <div class="user-info">
        <strong id="user-name">Loading...</strong>
        <p id="user-email"></p>
      </div>
      <button class="btn btn-secondary" id="open-dashboard-btn">Open Dashboard</button>
      <button class="btn btn-danger" id="logout-btn">Sign out</button>
    </div>

    <!-- App URL config -->
    <div class="app-url-section">
      <label for="app-url-input">MailDraft App URL:</label>
      <input
        type="url"
        id="app-url-input"
        placeholder="https://your-app.vercel.app"
      />
      <button class="save-url-btn" id="save-url-btn">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
